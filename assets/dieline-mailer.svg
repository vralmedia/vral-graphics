    <rect x="534" y="230" width="210" height="210"/>
    <rect x="246" y="152" width="210" height="78"/>
    <rect x="246" y="440" width="210" height="78"/>
    <path d="M268 118h166l22 34H246z"/>
    <path d="M268 552h166l22-34H246z"/>
  </g>

  <rect x="128" y="104" width="632" height="466" stroke="#111111" stroke-opacity="0.28" stroke-width="0.8" stroke-dasharray="2 3"/>

  <path fill="none" stroke="#111111" stroke-width="1.45" d="M168 230 L142 246 V424 L168 440 V518 H246 L268 552 H434 L456 518 H534 V440 H744 V230 H534 V152 H456 L434 118 H268 L246 152 H168 Z"/>

  <g stroke="#111111" stroke-opacity="0.45" stroke-width="1.05" stroke-dasharray="5 4">
