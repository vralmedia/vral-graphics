<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin — Vral Graphics</title>
    <meta name="theme-color" content="#071fdd" />
    <link rel="icon" href="../assets/vral-printmark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body data-page="admin" data-mark="../assets/vral-printmark.png">
    <div data-vral-header></div>
    <main id="content" class="shell admin-shell">
      <p class="admin-kicker" data-copy="kicker">Press room board</p>
      <h1 data-copy="title">Leads</h1>
      <p class="admin-lead" data-copy="lead">Mike sees his own tickets. Anthony sees every ticket. Paid never appears before a verified payment webhook.</p>

      <section id="login-panel" class="board-login" aria-labelledby="login-heading">
        <h2 id="login-heading" data-copy="loginTitle">Sign in</h2>
        <form id="login-form">
          <label><span data-copy="username">Username</span><input name="username" required autocomplete="username" /></label>
          <label><span data-copy="password">Password</span><input name="password" type="password" required autocomplete="current-password" /></label>
          <button class="btn btn-primary" type="submit" data-copy="signIn">Sign in</button>
        </form>
        <p id="login-status" class="status" role="status"></p>
      </section>

      <section id="board-panel" hidden>
        <div class="board-meta">
          <p id="session-line"></p>
          <button id="sign-out" class="btn btn-ghost" type="button" data-copy="signOut">Sign out</button>
        </div>
        <p id="board-status" class="status" role="status"></p>
        <div id="board" class="board" data-paid-rule="webhook-verified"></div>
      </section>
    </main>
    <div data-vral-footer></div>
    <script src="../shared/routes.js"></script>
    <script src="../shared/site-nav.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
