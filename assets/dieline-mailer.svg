<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dl-title dl-desc">
  <title id="dl-title">Mailer box dieline</title>
  <desc id="dl-desc">Unfolded 4 by 4 by 1.5 inch tuck mailer. Solid lines are cuts. Dashed lines are folds. Outer offset is bleed.</desc>
