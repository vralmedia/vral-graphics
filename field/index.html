<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Field — Vral Graphics</title>
    <meta name="theme-color" content="#f6f7fb" />
    <link rel="icon" href="../assets/vral-printmark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="./field.css" />
  </head>
  <body class="field-body" data-page="field" data-mark="../assets/vral-printmark.png">
    <div data-vral-header></div>
    <main id="content" class="field-shell">
      <section id="login-panel" class="field-login" aria-labelledby="login-heading">
        <img src="../assets/vral-printmark.png" width="64" height="64" alt="" />
        <h1 id="login-heading" data-copy="loginTitle">Field sign in</h1>
        <p data-copy="loginLead">Fast capture for conversations in the real world.</p>
        <form id="login-form">
          <label><span data-copy="username">Username</span><input name="username" required autocomplete="username" /></label>
          <label><span data-copy="password">Password</span><input name="password" type="password" required autocomplete="current-password" /></label>
          <button class="field-button is-primary" type="submit" data-copy="signIn">Sign in</button>
        </form>
        <p id="login-status" class="field-status" role="status"></p>
      </section>

      <section id="app-panel" class="field-app" hidden>
        <header class="field-head">
          <div class="field-brand"><img src="../assets/vral-printmark.png" width="42" height="42" alt="" /><div><strong>Vral Graphics</strong><span data-copy="fieldMode">Field</span></div></div>
          <div class="field-session"><span id="session-line"></span><button id="sign-out" type="button" data-copy="signOut">Sign out</button></div>
        </header>
        <div id="preview-banner" class="field-preview" hidden><strong data-copy="preview">Local experience preview</strong><span data-copy="previewNote">Nothing will be recorded.</span></div>
        <div class="field-grid">
          <section class="capture-panel" aria-labelledby="capture-title">
            <div class="capture-title"><span data-copy="timePromise">About 60 seconds</span><h1 id="capture-title" data-copy="title">Quick capture</h1><p data-copy="lead">Save the conversation. The system handles the follow-up.</p></div>
            <form id="lead-form" novalidate>
              <div class="field-pair">
                <label><span data-copy="business">Business</span><input name="business" required autocomplete="organization" /></label>
                <label><span data-copy="name">Contact</span><input name="name" required autocomplete="name" /></label>
              </div>
              <div class="field-pair">
                <label><span data-copy="phone">Phone / WhatsApp</span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" /></label>
                <label><span data-copy="email">Email</span><input name="email" type="email" autocomplete="email" inputmode="email" /></label>
              </div>
              <fieldset class="interest-picker">
                <legend data-copy="need">What do they need?</legend>
                <input name="interest" type="hidden" value="Printing" />
                <div class="interest-options">
                  <button type="button" data-interest="Business cards" data-copy="cards">Cards</button>
                  <button type="button" data-interest="Flyers" data-copy="flyers">Flyers</button>
                  <button type="button" data-interest="Menus" data-copy="menus">Menus</button>
                  <button type="button" data-interest="Banners" data-copy="banners">Banners</button>
                  <button type="button" data-interest="Window graphics" data-copy="windows">Windows</button>
                  <button type="button" data-interest="Signs" data-copy="signs">Signs</button>
                  <button type="button" data-interest="Other printing" data-copy="other">Other</button>
                </div>
              </fieldset>
              <details class="more-details">
                <summary data-copy="more">Add context</summary>
                <label><span data-copy="address">Address <small data-copy="optional">optional</small></span><input name="address" autocomplete="street-address" /></label>
                <label><span data-copy="notes">Note <small data-copy="optional">optional</small></span><textarea name="notes" data-copy-placeholder="notesPlaceholder" placeholder="What should happen next?"></textarea></label>
              </details>
              <label class="consent"><input name="consent" type="checkbox" /><span data-copy="consent">They asked to be contacted about printing.</span></label>
              <div class="hp"><label>Website<input name="website" tabindex="-1" autocomplete="off" /></label></div>
              <button class="field-button is-primary save-button" type="submit" data-copy="save">Save lead</button>
            </form>
            <p id="form-status" class="field-status" role="status"></p>
            <section id="result" class="field-result" hidden></section>
          </section>
          <aside class="recent-panel">
            <div class="recent-head"><h2 data-copy="mine">Recent leads</h2><span data-copy="private">Only what you can see</span></div>
            <div id="lead-list"><div class="field-skeleton"></div><div class="field-skeleton"></div></div>
          </aside>
        </div>
      </section>
    </main>
    <div data-vral-footer></div>
    <script src="../shared/routes.js"></script>
    <script src="../shared/site-nav.js"></script>
    <script src="../shared/public-intake.js"></script>
    <script src="./field.js"></script>
  </body>
</html>
