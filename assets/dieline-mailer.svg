    <text x="351" y="418">FRONT</text>
    <text x="495" y="340">RIGHT</text>
    <text x="639" y="340">BACK</text>
    <text x="351" y="196">TOP</text>
    <text x="351" y="484">BOTTOM</text>
    <text x="351" y="140" font-size="9">TUCK</text>
