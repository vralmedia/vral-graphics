<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Field — Vral Graphics</title>
    <meta name="theme-color" content="#071fdd" />
    <link rel="icon" href="../assets/vral-printmark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="./field.css" />
  </head>
  <body data-page="field" data-mark="../assets/vral-printmark.png">
    <div data-vral-header></div>
    <main id="content" class="shell field-shell">
      <p class="field-kicker" data-copy="kicker">Private field ticket</p>
      <h1 data-copy="title">Field</h1>
      <p class="field-lead" data-copy="lead">One-hand capture for Mike. Login required. Nothing is saved until the server says so.</p>

      <section id="login-panel" class="ticket" aria-labelledby="login-heading">
        <h2 id="login-heading" data-copy="loginTitle">Sign in</h2>
        <form id="login-form" autocomplete="username">
          <label>
            <span data-copy="username">Username</span>
            <input name="username" type="text" required autocomplete="username" />
          </label>
          <label>
            <span data-copy="password">Password</span>
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <button class="btn btn-primary" type="submit" data-copy="signIn">Sign in</button>
        </form>
        <p id="login-status" class="status" role="status"></p>
      </section>

      <section id="app-panel" class="ticket" hidden>
        <div class="field-meta">
          <p id="session-line"></p>
          <button id="sign-out" class="btn btn-ghost" type="button" data-copy="signOut">Sign out</button>
        </div>

        <form id="lead-form">
          <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <label>
            <span data-copy="name">Name</span>
            <input name="name" type="text" required autocomplete="name" inputmode="text" />
          </label>
          <label>
            <span data-copy="phone">Phone</span>
            <input name="phone" type="tel" required autocomplete="tel" inputmode="tel" />
          </label>
          <label>
            <span data-copy="email">Email</span>
            <input name="email" type="email" required autocomplete="email" inputmode="email" />
          </label>
          <label>
            <span data-copy="address">Address</span>
            <input name="address" type="text" required autocomplete="street-address" />
          </label>
          <label>
            <span data-copy="business">Business</span>
            <input name="business" type="text" required autocomplete="organization" />
          </label>
          <label>
            <span data-copy="interest">Interest</span>
            <input name="interest" type="text" value="Printing" />
          </label>
          <label class="consent">
            <input name="consent" type="checkbox" />
            <span data-copy="consent">They asked to be contacted about printing.</span>
          </label>
          <div class="actions">
            <button class="btn btn-primary" type="submit" data-action="save" data-copy="save">Save lead</button>
            <button class="btn btn-yellow" type="submit" data-action="save_and_send_offers" data-copy="saveOffers">Save and send offers</button>
            <button class="btn btn-ink" type="submit" data-action="save_and_open_whatsapp" data-copy="saveWhatsapp">Save and open WhatsApp</button>
            <button class="btn btn-ghost" type="button" id="another" data-copy="another">Create another lead</button>
          </div>
        </form>
        <p id="form-status" class="status" role="status"></p>
        <section id="result" class="result" hidden></section>

        <section class="mine" aria-labelledby="mine-heading">
          <h2 id="mine-heading" data-copy="mine">Leads you can see</h2>
          <div id="lead-list"></div>
        </section>
      </section>
    </main>
    <div data-vral-footer></div>
    <script src="../shared/routes.js"></script>
    <script src="../shared/site-nav.js"></script>
    <script src="../shared/public-intake.js"></script>
    <script src="./field.js"></script>
  </body>
</html>
